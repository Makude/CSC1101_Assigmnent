# Warehouse Simulation Configurations

# Timing (milliseconds per tick) 
tick_duration_ms=100

# Warehouse structure
num_stockers=2
num_pickers=3
num_sections=5

# Use -1 to let the program compute K = floor((num_stockers + num_pickers)/2)
num_trolleys=-1

# Good level default capacity
section_capacity=10

# Delivery parameters (we use mean inter-arrival ticks)
delivery_mean_interval_ticks=100

# Simulation parameters
simulation_duration_ticks=1000
initial_boxes_per_section=5

# Stocker parameters
stocker_break_duration_ticks=150
